name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "2.10.2"
      PYTHON_VERSION: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Airflow and project dependencies
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" -r requirements.txt -r requirements-dev.txt --constraint "$CONSTRAINTS"

      - name: Lint
        run: ruff check dags tests

      - name: Init Airflow metadata DB
        run: airflow db migrate

      - name: Run tests
        run: pytest -v
